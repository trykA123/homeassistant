# Source of truth for the live dashboard `home-harbour`. Push with: node scripts/push-home.mjs
# Rollback:                                                         node scripts/push-home.mjs --rollback
title: Home
kiosk_mode:
  non_admin_settings:
    hide_header: true
    hide_sidebar: true
views:
  - title: Home
    path: home
    type: sections
    max_columns: 4
    dense_section_placement: true
    theme: Harbour
    badges:
      - type: entity
        entity: person.claud
        show_name: false
        show_state: true
      - type: entity
        entity: sensor.unavailable_devices
        name: Offline
        show_name: true
        visibility:
          - condition: numeric_state
            entity: sensor.unavailable_devices
            above: 0
      - type: entity
        entity: binary_sensor.birou_overloaded
        name: Desk overloaded
        show_name: true
        visibility:
          - condition: state
            entity: binary_sensor.birou_overloaded
            state: "on"
      - type: entity
        entity: vacuum.clea_ning
        show_name: true
        visibility:
          - condition: state
            entity: vacuum.clea_ning
            state_not: docked
    sections:
      - type: grid
        cards:
          - type: markdown
            grid_options: {columns: 12, rows: auto}
            text_only: true
            content: |-
              {% set h = now().hour %}
              # {{ 'Good morning' if h < 12 else 'Good afternoon' if h < 18 else 'Good evening' }}
              {{ now().strftime('%A %-d %B') }} · {{ states('sensor.living_room_lights_on') }} lights on · desk {{ states('sensor.birou_current_consumption') | round(0) }} W · vacuum {{ states('vacuum.clea_ning') }}
          - &sep_scenes
            type: custom:bubble-card
            card_type: separator
            name: Scenes
            icon: mdi:palette-outline
            grid_options: {columns: 12}
          - &scene
            type: custom:bubble-card
            card_type: button
            button_type: name
            entity: scene.evening
            name: Evening
            icon: mdi:weather-sunset
            grid_options: {columns: 6}
            tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.evening}}
          - <<: *scene
            entity: scene.relax
            name: Relax
            icon: mdi:leaf
            tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.relax}}
          - <<: *scene
            entity: scene.night
            name: Night
            icon: mdi:weather-night
            tap_action: {action: perform-action, perform_action: scene.turn_on, target: {entity_id: scene.night}}
          - <<: *scene
            entity: script.movie_time
            name: Movie time
            icon: mdi:movie-open
            tap_action: {action: perform-action, perform_action: script.turn_on, target: {entity_id: script.movie_time}}
          - <<: *scene
            entity: script.all_off
            name: All off
            icon: mdi:power
            grid_options: {columns: 12}
            tap_action: {action: perform-action, perform_action: script.turn_on, target: {entity_id: script.all_off}}

      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Rooms
            icon: mdi:door-open
            grid_options: {columns: 12}
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: light.living_room_lights
            name: Living room
            icon: mdi:sofa-outline
            show_state: true
            use_accent_color: true
            grid_options: {columns: 12}
            tap_action: {action: navigate, navigation_path: "#living-room"}
            sub_button:
              main:
                - entity: light.living_room_lights
                  icon: mdi:lightbulb-group-outline
                  tap_action: {action: toggle}
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: light.bedside_lamp
            name: Bedroom
            icon: mdi:bed-outline
            show_state: true
            use_accent_color: true
            grid_options: {columns: 12}
            tap_action: {action: navigate, navigation_path: "#bedroom"}
            sub_button:
              main:
                - entity: fan.bedroom_fan
                  icon: mdi:fan
                  tap_action: {action: toggle}
                - entity: light.bedside_lamp
                  icon: mdi:lamp-outline
                  tap_action: {action: toggle}
          - type: custom:bubble-card
            card_type: separator
            name: Television
            icon: mdi:television
            grid_options: {columns: 12}
          - type: custom:bubble-card
            card_type: media-player
            entity: media_player.tv
            name: TV
            icon: mdi:television
            grid_options: {columns: 12}
            hide:
              next_button: true
              previous_button: true
            sub_button:
              main:
                - icon: mdi:remote
                  tap_action: {action: navigate, navigation_path: "#tv-remote"}
                - entity: media_player.tv
                  icon: mdi:power
                  tap_action: {action: toggle}

      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Weather
            icon: mdi:weather-partly-cloudy
            grid_options: {columns: 12}
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            show_current: true
            show_forecast: true
            grid_options: {columns: 12, rows: auto}

      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Robot vacuum
            icon: mdi:robot-vacuum
            grid_options: {columns: 12}
          - type: tile
            entity: vacuum.clea_ning
            name: Clea Ning
            grid_options: {columns: 12}
            features_position: bottom
            features:
              - type: vacuum-commands
                commands: [start_pause, return_home, locate]
          - type: custom:bubble-card
            card_type: select
            entity: select.clea_ning_suction
            name: Suction
            icon: mdi:fan-speed-3
            grid_options: {columns: 12}
          - type: custom:bubble-card
            card_type: select
            entity: select.clea_ning_mop_mode
            name: Mop
            icon: mdi:water-outline
            grid_options: {columns: 12}
          - type: glance
            show_icon: false
            columns: 3
            grid_options: {columns: 12}
            entities:
              - {entity: sensor.clea_ning_battery, name: Battery}
              - {entity: sensor.clea_ning_filter_life, name: Filter}
              - {entity: sensor.clea_ning_mop_life, name: Mop}
          - type: custom:bubble-card
            card_type: button
            button_type: name
            entity: button.clea_ning_wash_mop
            name: Wash mop
            icon: mdi:water-sync
            grid_options: {columns: 12}
            tap_action: {action: perform-action, perform_action: button.press, target: {entity_id: button.clea_ning_wash_mop}}

      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Desk energy
            icon: mdi:desk
            grid_options: {columns: 12}
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: switch.birou
            name: Birou
            icon: mdi:desk
            show_state: true
            use_accent_color: true
            grid_options: {columns: 12}
            tap_action: {action: toggle}
          - &stat
            type: custom:bubble-card
            card_type: button
            button_type: state
            entity: sensor.birou_current_consumption
            name: Power now
            icon: mdi:flash-outline
            show_state: true
            grid_options: {columns: 6}
          - <<: *stat
            entity: sensor.birou_today_s_consumption
            name: Today
            icon: mdi:lightning-bolt-outline
          - <<: *stat
            entity: sensor.desk_cost_today
            name: Cost today
            icon: mdi:cash
          - <<: *stat
            entity: sensor.desk_cost_month
            name: This month
            icon: mdi:calendar-month
          - type: statistics-graph
            title: Energy per day
            entities: [{entity: sensor.birou_today_s_consumption, name: kWh}]
            chart_type: bar
            period: day
            stat_types: [change]
            days_to_show: 14
            hide_legend: true
            grid_options: {columns: 12, rows: 4}
          - type: statistics-graph
            title: Power, last 24 h
            entities: [{entity: sensor.birou_current_consumption, name: W}]
            chart_type: line
            period: hour
            stat_types: [mean]
            days_to_show: 1
            hide_legend: true
            grid_options: {columns: 12, rows: 4}

      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Shopping list
            icon: mdi:cart-outline
            grid_options: {columns: 12}
          - type: todo-list
            entity: todo.shopping_list
            grid_options: {columns: 12}

      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#living-room"
            name: Living room
            icon: mdi:sofa-outline
            bg_blur: 0
            bg_opacity: 100
            shadow_opacity: 0
            sub_button:
              main:
                - entity: light.living_room_lights
                  icon: mdi:lightbulb-group-outline
                  tap_action: {action: toggle}
            cards:
              - type: custom:bubble-card
                card_type: separator
                name: Lights
                icon: mdi:lightbulb-group-outline
              - &lightslider
                type: custom:bubble-card
                card_type: button
                button_type: slider
                entity: light.living_room_lights
                name: All lights
                show_state: true
                use_accent_color: true
                allow_light_slider_to_0: true
              - <<: *lightslider
                entity: light.light_1
                name: Light 1
              - <<: *lightslider
                entity: light.light_2
                name: Light 2
              - <<: *lightslider
                entity: light.h619a
                name: Floor lamp
              - <<: *lightslider
                entity: light.tv_ambilight
                name: Ambilight
              - type: custom:bubble-card
                card_type: button
                button_type: switch
                entity: switch.tv_ambilight_hue
                name: Ambilight + Hue
                icon: mdi:television-ambient-light
                show_state: true
                use_accent_color: true
              - type: custom:bubble-card
                card_type: button
                button_type: name
                entity: media_player.tv
                name: TV remote
                icon: mdi:remote
                tap_action: {action: navigate, navigation_path: "#tv-remote"}
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#bedroom"
            name: Bedroom
            icon: mdi:bed-outline
            bg_blur: 0
            bg_opacity: 100
            shadow_opacity: 0
            cards:
              - type: custom:bubble-card
                card_type: separator
                name: Lights
                icon: mdi:lamp-outline
              - <<: *lightslider
                entity: light.bedside_lamp
                name: Bedside lamp
              - type: custom:bubble-card
                card_type: separator
                name: Air
                icon: mdi:fan
              - type: custom:bubble-card
                card_type: button
                button_type: slider
                entity: fan.bedroom_fan
                name: Fan
                show_state: true
                use_accent_color: true
              - type: conditional
                conditions:
                  - {condition: state, entity: sensor.bedroom_temperature, state_not: unknown}
                  - {condition: state, entity: sensor.bedroom_temperature, state_not: unavailable}
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.bedroom_temperature
                  name: Temperature
                  show_state: true
              - type: conditional
                conditions:
                  - {condition: state, entity: sensor.bedroom_humidity, state_not: unknown}
                  - {condition: state, entity: sensor.bedroom_humidity, state_not: unavailable}
                card:
                  type: custom:bubble-card
                  card_type: button
                  button_type: state
                  entity: sensor.bedroom_humidity
                  name: Humidity
                  show_state: true
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#tv-remote"
            name: TV remote
            icon: mdi:television
            bg_blur: 0
            bg_opacity: 100
            shadow_opacity: 0
            sub_button:
              main:
                - entity: media_player.tv
                  icon: mdi:power
                  tap_action: {action: toggle}
            cards:
              - type: conditional
                conditions:
                  - {condition: state, entity: media_player.tv, state: "off"}
                card:
                  type: markdown
                  text_only: true
                  content: Turn the TV on to show the remote.
              - type: conditional
                conditions:
                  - {condition: state, entity: media_player.tv, state_not: "off"}
                card:
                  type: vertical-stack
                  cards:
                    - type: grid
                      columns: 3
                      square: false
                      card_mod:
                        style: |
                          ha-card { background: var(--card-background-color); border-radius: var(--ha-card-border-radius); padding: 12px; }
                      cards:
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: remote.tv
                          icon: mdi:volume-plus
                          show_name: false
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.tv
                            data:
                              command: VOLUME_UP
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: remote.tv
                          icon: mdi:chevron-up
                          show_name: false
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.tv
                            data:
                              command: DPAD_UP
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: remote.tv
                          icon: mdi:chevron-up-box-outline
                          show_name: false
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.tv
                            data:
                              command: CHANNEL_UP
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: remote.tv
                          icon: mdi:chevron-left
                          show_name: false
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.tv
                            data:
                              command: DPAD_LEFT
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: remote.tv
                          icon: mdi:circle-double
                          show_name: false
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.tv
                            data:
                              command: DPAD_CENTER
                          styles: |
                            .bubble-button-card-container { background: var(--primary-color) !important; }
                            .bubble-icon-container { background: var(--text-primary-color) !important; }
                            .bubble-icon { color: var(--primary-color) !important; }
                            .bubble-icon-container { margin: 0 auto !important; }
                            .bubble-name-container, .bubble-sub-button-container { display: none !important; }
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: remote.tv
                          icon: mdi:chevron-right
                          show_name: false
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.tv
                            data:
                              command: DPAD_RIGHT
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: remote.tv
                          icon: mdi:volume-minus
                          show_name: false
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.tv
                            data:
                              command: VOLUME_DOWN
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: remote.tv
                          icon: mdi:chevron-down
                          show_name: false
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.tv
                            data:
                              command: DPAD_DOWN
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: remote.tv
                          icon: mdi:chevron-down-box-outline
                          show_name: false
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.tv
                            data:
                              command: CHANNEL_DOWN
                    - type: grid
                      columns: 2
                      square: false
                      cards:
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: remote.tv
                          icon: mdi:arrow-u-left-top
                          show_name: true
                          name: Back
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.tv
                            data:
                              command: BACK
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: remote.tv
                          icon: mdi:home-outline
                          show_name: true
                          name: Home
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.tv
                            data:
                              command: HOME
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: remote.tv
                          icon: mdi:menu
                          show_name: true
                          name: Menu
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.tv
                            data:
                              command: MENU
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: remote.tv
                          icon: mdi:volume-off
                          show_name: true
                          name: Mute
                          tap_action:
                            action: perform-action
                            perform_action: remote.send_command
                            target:
                              entity_id: remote.tv
                            data:
                              command: VOLUME_MUTE
                    - type: custom:bubble-card
                      card_type: separator
                      name: Apps
                      icon: mdi:apps
                    - type: grid
                      columns: 2
                      square: false
                      cards:
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: media_player.tv
                          icon: mdi:youtube
                          name: YouTube
                          tap_action:
                            action: perform-action
                            perform_action: media_player.play_media
                            target:
                              entity_id: media_player.tv
                            data:
                              media_content_type: app
                              media_content_id: com.google.android.apps.youtube.tv.activity.ShellActivity-com.google.android.youtube.tv
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: media_player.tv
                          icon: mdi:moon-waning-crescent
                          name: Moonfin
                          tap_action:
                            action: perform-action
                            perform_action: media_player.play_media
                            target:
                              entity_id: media_player.tv
                            data:
                              media_content_type: app
                              media_content_id: org.moonfin.androidtv.MainActivity-org.moonfin.androidtv
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: media_player.tv
                          icon: mdi:dolphin
                          name: Wholphin
                          tap_action:
                            action: perform-action
                            perform_action: media_player.play_media
                            target:
                              entity_id: media_player.tv
                            data:
                              media_content_type: app
                              media_content_id: com.github.damontecres.wholphin.MainActivity-com.github.damontecres.wholphin
                        - type: custom:bubble-card
                          card_type: button
                          button_type: name
                          entity: media_player.tv
                          icon: mdi:jellyfish-outline
                          name: Jellyfin
                          tap_action:
                            action: perform-action
                            perform_action: media_player.play_media
                            target:
                              entity_id: media_player.tv
                            data:
                              media_content_type: app
                              media_content_id: org.jellyfin.androidtv.ui.startup.StartupActivity-org.jellyfin.androidtv

      - type: grid
        cards:
          - type: custom:bubble-card
            card_type: horizontal-buttons-stack
            1_icon: mdi:home-outline
            1_link: /home-harbour/home
            2_name: Living
            2_icon: mdi:sofa-outline
            2_link: "#living-room"
            2_entity: light.living_room_lights
            3_name: Bed
            3_icon: mdi:bed-outline
            3_link: "#bedroom"
            3_entity: light.bedside_lamp
            4_icon: mdi:television
            4_link: "#tv-remote"
            4_entity: media_player.tv

      - type: grid
        cards:
          - type: markdown
            text_only: true
            content: " "
            card_mod:
              style: |
                ha-card { height: 88px; background: none; border: none; }
