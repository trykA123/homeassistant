# Dashboard: "Aurora" — a living sky that follows the real sun.
# Design read: someone at home wants calm, glanceable control. Deep night palette,
# one hero that changes colour with sun phase, light orbs that glow in the real lamp colour.
# Flow (top to bottom): NOW (sky + scenes) -> LIGHT (orbs, sliders, tone) -> HOME (status).
# Mobile-first for iPhone (393px); two columns on wide screens.

button_card_templates:
  # ── Sky hero: gradient, sun arc and weather follow the real sun ───────────
  aurora_hero:
    entity: sun.sun
    show_icon: false
    show_name: false
    show_state: false
    tap_action: { action: none }
    triggers_update:
      - sensor.home_greeting
      - sensor.sun_next_rising
      - sensor.sun_next_setting
      - sensor.living_room_lights_on
      - weather.forecast_home
      - person.claud
    custom_fields:
      hero: >-
        [[[
          const sun = states['sun.sun'];
          const el = Number(sun?.attributes?.elevation ?? -20);
          const rising = !!sun?.attributes?.rising;
          const above = sun?.state === 'above_horizon';
          const now = Date.now();
          const rise = new Date(states['sensor.sun_next_rising']?.state).getTime();
          const set = new Date(states['sensor.sun_next_setting']?.state).getTime();
          const fmt = (t) => isNaN(t) ? '--:--' : new Date(t).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', hour12: false});
          let p = null;
          if (above && !isNaN(rise) && !isNaN(set)) {
            const r = rise - 86400000;
            p = Math.max(0.03, Math.min(0.97, (now - r) / (set - r)));
          }
          let phase = 'night';
          if (el > 8) phase = 'day'; else if (el > -6) phase = rising ? 'dawn' : 'dusk';
          const grads = { night: ['#070b1f', '#221a5c'], dawn: ['#2d1b4e', '#ff9966'], day: ['#0c3b66', '#2aa7c9'], dusk: ['#2a1245', '#ff6a5c'] };
          const [g1, g2] = grads[phase];
          const w = states['weather.forecast_home'];
          const icons = { sunny: 'weather-sunny', 'clear-night': 'weather-night', cloudy: 'weather-cloudy', partlycloudy: 'weather-partly-cloudy', rainy: 'weather-rainy', pouring: 'weather-pouring', snowy: 'weather-snowy', fog: 'weather-fog', windy: 'weather-windy', lightning: 'weather-lightning' };
          const wxIcon = icons[w?.state] || 'weather-partly-cloudy';
          const temp = w?.attributes?.temperature != null ? Math.round(w.attributes.temperature) : '--';
          const greet = states['sensor.home_greeting']?.state ?? 'Hello';
          const who = states['person.claud'];
          const name = who?.attributes?.friendly_name ?? 'there';
          const home = who?.state === 'home';
          const lit = Number(states['sensor.living_room_lights_on']?.state || 0);
          const sub = lit ? `${lit} light${lit > 1 ? 's' : ''} glowing` : (home ? 'Everything is calm' : 'The house rests while you are away');
          const day = new Date().toLocaleDateString([], {weekday: 'long', day: 'numeric', month: 'long'});
          const x = p === null ? 150 : 150 - 130 * Math.cos(Math.PI * p);
          const y = p === null ? 100 : 100 - 80 * Math.sin(Math.PI * p);
          const dot = p === null ? '' : `<circle class="sun" cx="${x}" cy="${y}" r="9"/>`;
          const prog = p === null ? 0 : p * 100;
          return `
            <div class="hero" style="--g1:${g1};--g2:${g2};">
              <div class="top">
                <span class="date">${day}</span>
                <span class="wx"><ha-icon icon="mdi:${wxIcon}"></ha-icon>${temp}°</span>
              </div>
              <h1>${greet},<br>${name}</h1>
              <p class="sub">${sub}</p>
              <svg class="arc" viewBox="0 0 300 112" preserveAspectRatio="xMidYMid meet">
                <path class="track" d="M20 100 A130 80 0 0 1 280 100" pathLength="100"/>
                <path class="fill" d="M20 100 A130 80 0 0 1 280 100" pathLength="100" stroke-dasharray="${prog} 100"/>
                <line class="horizon" x1="6" y1="100" x2="294" y2="100"/>
                ${dot}
              </svg>
              <div class="times">
                <span><ha-icon icon="mdi:weather-sunset-up"></ha-icon>${fmt(rise)}</span>
                ${p === null ? '<span class="moon"><ha-icon icon="mdi:moon-waning-crescent"></ha-icon>Night</span>' : ''}
                <span>${fmt(set)}<ha-icon icon="mdi:weather-sunset-down"></ha-icon></span>
              </div>
            </div>`;
        ]]]
    styles:
      card:
        - padding: 0
        - background: none
        - border: none
        - box-shadow: none
        - overflow: visible
      grid:
        - grid-template-areas: '"hero"'
      custom_fields:
        hero:
          - width: 100%
    extra_styles: |
      #hero { text-align: left; width: 100%; }
      .hero { position: relative; overflow: hidden; border-radius: 30px; padding: 20px 20px 14px; color: #fff; text-align: left;
        background: linear-gradient(160deg, var(--g1), var(--g2));
        box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
      .hero::after { content: ''; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(110% 60% at 88% 0%, rgba(255,255,255,.18), transparent 60%); }
      .top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }
      .date { font-size: 12px; font-weight: 600; letter-spacing: .04em; opacity: .8; }
      .wx { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
        background: rgba(255,255,255,.16); font-size: 14px; font-weight: 700; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
      ha-icon { --mdc-icon-size: 18px; width: 18px; height: 18px; display: inline-flex; }
      h1 { position: relative; z-index: 1; margin: 18px 0 4px; font-size: 34px; line-height: 1.05; font-weight: 800; letter-spacing: -.03em; text-transform: none; }
      .sub { position: relative; z-index: 1; margin: 0; font-size: 14px; font-weight: 500; opacity: .78; }
      .arc { position: relative; z-index: 1; display: block; width: 100%; height: auto; margin-top: 10px; overflow: visible; }
      .arc path { fill: none; stroke-linecap: round; stroke-width: 3; }
      .arc .track { stroke: rgba(255,255,255,.22); stroke-dasharray: 2 3; }
      .arc .fill { stroke: #fff; filter: drop-shadow(0 0 6px rgba(255,255,255,.7)); }
      .arc .horizon { stroke: rgba(255,255,255,.28); stroke-width: 1; }
      .arc .sun { fill: #fff; filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px rgba(255,220,150,.9)); }
      .times { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; letter-spacing: .04em; opacity: .85; }
      .times span { display: inline-flex; align-items: center; gap: 5px; }

  aurora_heading:
    show_icon: false
    show_state: false
    tap_action: { action: none }
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - padding: 14px 6px 0
      name:
        - justify-self: start
        - font-size: 11px
        - font-weight: 700
        - letter-spacing: .18em
        - text-transform: uppercase
        - color: "#8ea0bf"

  # ── Scene tiles ───────────────────────────────────────────────────────────
  aurora_scene:
    show_icon: true
    show_name: true
    show_state: false
    tap_action:
      action: perform-action
      perform_action: "[[[ return entity.entity_id.startsWith('script.') ? 'script.turn_on' : 'scene.turn_on' ]]]"
      target:
        entity_id: "[[[ return entity.entity_id ]]]"
      haptic: success
    styles:
      card:
        - height: 88px
        - padding: 12px
        - border-radius: 22px
        - border: 1px solid rgba(255,255,255,.14)
        - box-shadow: 0 14px 28px -18px "[[[ return variables.g2 ]]]"
        - background: "[[[ return `linear-gradient(150deg, ${variables.g1}, ${variables.g2})` ]]]"
      grid:
        - grid-template-areas: '"i" "n"'
        - grid-template-rows: 1fr auto
        - grid-template-columns: 1fr
      img_cell:
        - justify-self: start
        - align-self: start
        - width: 26px
        - height: 26px
      icon:
        - width: 24px
        - color: "#ffffff"
      name:
        - justify-self: start
        - font-size: 14px
        - font-weight: 700
        - color: "#ffffff"
        - letter-spacing: -.01em
    extra_styles: |
      ha-card { transition: transform 140ms ease; }
      ha-card:active { transform: scale(.95); }

  # ── Light orb: glows in the lamp's real colour ───────────────────────────
  aurora_orb:
    show_icon: false
    show_name: false
    show_state: false
    tap_action: { action: toggle, haptic: light }
    hold_action: { action: more-info }
    custom_fields:
      o: >-
        [[[
          const on = entity.state === 'on';
          const rgb = entity.attributes.rgb_color;
          const col = on ? (rgb ? `rgb(${rgb.join(',')})` : '#ffd28a') : '#2a3347';
          const bri = on ? Math.round((entity.attributes.brightness || 0) / 2.55) : 0;
          const un = entity.state === 'unavailable';
          return `
            <div class="orb ${on ? 'on' : ''}" style="--c:${col}"><ha-icon icon="${variables.icon}"></ha-icon></div>
            <div class="nm">${variables.label}</div>
            <div class="st">${un ? 'N/A' : on ? bri + '%' : 'Off'}</div>`;
        ]]]
    styles:
      card:
        - padding: 12px 0 10px
        - border-radius: 22px
        - background: rgba(255,255,255,.04)
        - border: 1px solid rgba(255,255,255,.07)
        - box-shadow: none
      grid:
        - grid-template-areas: '"o"'
    extra_styles: |
      ha-card { transition: transform 140ms ease; }
      ha-card:active { transform: scale(.94); }
      ha-icon { --mdc-icon-size: 24px; width: 24px; height: 24px; display: inline-flex; }
      #o { text-align: center; }
      .orb { width: 54px; height: 54px; margin: 0 auto 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        background: rgba(255,255,255,.06); color: #6d7b96; border: 1px solid rgba(255,255,255,.08); transition: all 260ms ease; }
      .orb.on { background: radial-gradient(circle at 35% 30%, #fff8, var(--c) 62%); color: #0b1020; border-color: transparent;
        box-shadow: 0 0 26px var(--c), 0 0 60px -6px var(--c); }
      .nm { font-size: 12px; font-weight: 700; color: #eaf2ff; }
      .st { font-size: 11px; font-weight: 600; color: #8ea0bf; margin-top: 1px; }

  aurora_swatch:
    show_icon: false
    show_state: false
    show_name: true
    styles:
      card:
        - height: 40px
        - border-radius: 14px
        - padding: 0
        - box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 18px -12px "[[[ return variables.bg ]]]"
        - border: 1px solid rgba(255,255,255,.12)
        - background: "[[[ return variables.bg ]]]"
      name:
        - font-size: 11px
        - font-weight: 800
        - color: rgba(0,0,0,.62)
    extra_styles: |
      ha-card { transition: transform 120ms ease; }
      ha-card:active { transform: scale(.9); }

  aurora_stat:
    show_icon: false
    show_name: false
    show_state: false
    styles:
      card:
        - padding: 14px
        - border-radius: 22px
        - background: rgba(255,255,255,.05)
        - border: 1px solid rgba(255,255,255,.08)
        - box-shadow: none
      grid:
        - grid-template-areas: '"s"'
      custom_fields:
        s:
          - width: 100%
    extra_styles: |
      ha-card { transition: transform 140ms ease; }
      ha-card:active { transform: scale(.96); }
      ha-icon { --mdc-icon-size: 16px; width: 16px; height: 16px; display: inline-flex; flex: 0 0 auto; margin: 0; }
      #s { text-align: left; display: block; }
      .k { display: flex; justify-content: flex-start; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #8ea0bf; }
      .v { margin-top: 8px; font-size: 26px; font-weight: 800; letter-spacing: -.03em; color: #eaf2ff; }
      .v.on { color: #5eead4; text-shadow: 0 0 22px rgba(94,234,212,.5); }
      .s { margin-top: 2px; font-size: 12px; font-weight: 500; color: #8ea0bf; }

title: Aurora
views:
  - title: Flow
    path: flow
    icon: mdi:weather-night
    theme: Aurora
    type: sections
    max_columns: 2
    sections:
      # ── 1 · NOW ─────────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: custom:button-card
            template: aurora_hero
            grid_options: { columns: full }
          - type: custom:button-card
            template: aurora_heading
            name: Scenes
            grid_options: { columns: full }
          - type: grid
            columns: 3
            square: false
            grid_options: { columns: full }
            cards:
              - type: custom:button-card
                template: aurora_scene
                entity: scene.evening
                name: Evening
                icon: mdi:weather-sunset
                variables: { g1: "#ff9a62", g2: "#c0397a" }
              - type: custom:button-card
                template: aurora_scene
                entity: scene.relax
                name: Relax
                icon: mdi:sofa
                variables: { g1: "#5b8def", g2: "#7b4fe0" }
              - type: custom:button-card
                template: aurora_scene
                entity: scene.night
                name: Night
                icon: mdi:weather-night
                variables: { g1: "#2a3a9a", g2: "#0d1235" }
              - type: custom:button-card
                template: aurora_scene
                entity: script.movie_time
                name: Movie
                icon: mdi:movie-open
                variables: { g1: "#ff5f6d", g2: "#3a0f2e" }
              - type: custom:button-card
                template: aurora_scene
                entity: light.living_room_lights
                name: Focus
                icon: mdi:target
                variables: { g1: "#4cc9f0", g2: "#2563eb" }
                tap_action:
                  action: perform-action
                  perform_action: light.turn_on
                  target: { entity_id: light.living_room_lights }
                  data: { color_temp_kelvin: 5000, brightness_pct: 100 }
                  haptic: success
              - type: custom:button-card
                template: aurora_scene
                entity: script.all_off
                name: All off
                icon: mdi:power
                variables: { g1: "#3b4560", g2: "#171c2b" }

      # ── 2 · LIGHT ───────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: custom:button-card
            template: aurora_heading
            name: Light
            grid_options: { columns: full }
          - type: grid
            columns: 4
            square: false
            grid_options: { columns: full }
            cards:
              - type: custom:button-card
                template: aurora_orb
                entity: light.light_1
                variables: { icon: "mdi:floor-lamp", label: "Lamp 1" }
              - type: custom:button-card
                template: aurora_orb
                entity: light.light_2
                variables: { icon: "mdi:floor-lamp", label: "Lamp 2" }
              - type: custom:button-card
                template: aurora_orb
                entity: light.h619a
                variables: { icon: "mdi:led-strip-variant", label: "Strip" }
              - type: custom:button-card
                template: aurora_orb
                entity: light.tv_ambilight
                variables: { icon: "mdi:television-ambient-light", label: "Ambi" }
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: light.living_room_lights
            name: All lights
            icon: mdi:lightbulb-group
            show_state: true
            card_layout: large
            tap_action: { action: toggle, haptic: light }
            hold_action: { action: more-info }
            grid_options: { columns: full, rows: 1 }
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: light.light_1
            name: Lamp 1
            icon: mdi:floor-lamp
            show_state: true
            card_layout: large
            tap_action: { action: toggle, haptic: light }
            hold_action: { action: more-info }
            grid_options: { columns: full, rows: 1 }
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: light.light_2
            name: Lamp 2
            icon: mdi:floor-lamp
            show_state: true
            card_layout: large
            tap_action: { action: toggle, haptic: light }
            hold_action: { action: more-info }
            grid_options: { columns: full, rows: 1 }
          - type: custom:bubble-card
            card_type: button
            button_type: slider
            entity: light.h619a
            name: LED strip
            icon: mdi:led-strip-variant
            show_state: true
            card_layout: large
            tap_action: { action: toggle, haptic: light }
            hold_action: { action: more-info }
            grid_options: { columns: full, rows: 1 }
          - type: custom:button-card
            template: aurora_heading
            name: Tone · warm to cold
            grid_options: { columns: full }
          - type: grid
            columns: 6
            square: false
            grid_options: { columns: full }
            cards:
              - type: custom:button-card
                template: aurora_swatch
                name: "2.2"
                variables: { bg: "#ff9d3c" }
                tap_action: { action: perform-action, perform_action: light.turn_on, target: { entity_id: light.living_room_lights }, data: { color_temp_kelvin: 2200 }, haptic: light }
              - type: custom:button-card
                template: aurora_swatch
                name: "2.7"
                variables: { bg: "#ffb865" }
                tap_action: { action: perform-action, perform_action: light.turn_on, target: { entity_id: light.living_room_lights }, data: { color_temp_kelvin: 2700 }, haptic: light }
              - type: custom:button-card
                template: aurora_swatch
                name: "3.5"
                variables: { bg: "#ffd9a8" }
                tap_action: { action: perform-action, perform_action: light.turn_on, target: { entity_id: light.living_room_lights }, data: { color_temp_kelvin: 3500 }, haptic: light }
              - type: custom:button-card
                template: aurora_swatch
                name: "4.5"
                variables: { bg: "#f3efe6" }
                tap_action: { action: perform-action, perform_action: light.turn_on, target: { entity_id: light.living_room_lights }, data: { color_temp_kelvin: 4500 }, haptic: light }
              - type: custom:button-card
                template: aurora_swatch
                name: "5.5"
                variables: { bg: "#d4e2ff" }
                tap_action: { action: perform-action, perform_action: light.turn_on, target: { entity_id: light.living_room_lights }, data: { color_temp_kelvin: 5500 }, haptic: light }
              - type: custom:button-card
                template: aurora_swatch
                name: "6.5"
                variables: { bg: "#a9c6ff" }
                tap_action: { action: perform-action, perform_action: light.turn_on, target: { entity_id: light.living_room_lights }, data: { color_temp_kelvin: 6500 }, haptic: light }
          - type: custom:button-card
            template: aurora_heading
            name: Colour · tap to paint every lamp
            grid_options: { columns: full }
          - type: grid
            columns: 6
            square: false
            grid_options: { columns: full }
            cards:
              - type: custom:button-card
                template: aurora_swatch
                variables: { bg: "#ff4d6d" }
                tap_action: { action: perform-action, perform_action: light.turn_on, target: { entity_id: light.living_room_lights }, data: { rgb_color: [255, 77, 109] }, haptic: light }
              - type: custom:button-card
                template: aurora_swatch
                variables: { bg: "#ff9632" }
                tap_action: { action: perform-action, perform_action: light.turn_on, target: { entity_id: light.living_room_lights }, data: { rgb_color: [255, 150, 50] }, haptic: light }
              - type: custom:button-card
                template: aurora_swatch
                variables: { bg: "#3ce68c" }
                tap_action: { action: perform-action, perform_action: light.turn_on, target: { entity_id: light.living_room_lights }, data: { rgb_color: [60, 230, 140] }, haptic: light }
              - type: custom:button-card
                template: aurora_swatch
                variables: { bg: "#00dcff" }
                tap_action: { action: perform-action, perform_action: light.turn_on, target: { entity_id: light.living_room_lights }, data: { rgb_color: [0, 220, 255] }, haptic: light }
              - type: custom:button-card
                template: aurora_swatch
                variables: { bg: "#5070ff" }
                tap_action: { action: perform-action, perform_action: light.turn_on, target: { entity_id: light.living_room_lights }, data: { rgb_color: [80, 112, 255] }, haptic: light }
              - type: custom:button-card
                template: aurora_swatch
                variables: { bg: "#b05aff" }
                tap_action: { action: perform-action, perform_action: light.turn_on, target: { entity_id: light.living_room_lights }, data: { rgb_color: [176, 90, 255] }, haptic: light }

      # ── 3 · HOME ────────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: custom:button-card
            template: aurora_heading
            name: Home
            grid_options: { columns: full }
          - type: grid
            columns: 2
            square: false
            grid_options: { columns: full }
            cards:
              - type: custom:button-card
                template: aurora_stat
                entity: media_player.tv
                tap_action: { action: more-info }
                custom_fields:
                  s: >-
                    [[[
                      const on = entity.state !== 'off' && entity.state !== 'unavailable';
                      return `<div class="k"><ha-icon icon="mdi:television"></ha-icon>TV</div><div class="v ${on ? 'on' : ''}">${on ? 'On' : 'Off'}</div><div class="s">Philips 65″</div>`;
                    ]]]
              - type: custom:button-card
                template: aurora_stat
                entity: sensor.birou_current_consumption
                triggers_update: [sensor.desk_cost_today]
                tap_action: { action: more-info }
                custom_fields:
                  s: >-
                    [[[
                      const w = Math.round(Number(entity.state) || 0);
                      const cost = states['sensor.desk_cost_today']?.state ?? '0';
                      return `<div class="k"><ha-icon icon="mdi:desktop-tower-monitor"></ha-icon>Desk</div><div class="v ${w > 5 ? 'on' : ''}">${w} W</div><div class="s">${cost} RON today</div>`;
                    ]]]
              - type: custom:button-card
                template: aurora_stat
                entity: person.claud
                tap_action: { action: more-info }
                custom_fields:
                  s: >-
                    [[[
                      const home = entity.state === 'home';
                      return `<div class="k"><ha-icon icon="mdi:account"></ha-icon>Presence</div><div class="v ${home ? 'on' : ''}">${home ? 'Home' : 'Away'}</div><div class="s">${entity.attributes.friendly_name ?? ''}</div>`;
                    ]]]
              - type: custom:button-card
                template: aurora_stat
                entity: input_boolean.sync_light_colors
                tap_action: { action: toggle, haptic: medium }
                custom_fields:
                  s: >-
                    [[[
                      const on = entity.state === 'on';
                      return `<div class="k"><ha-icon icon="mdi:palette-swatch"></ha-icon>Colour sync</div><div class="v ${on ? 'on' : ''}">${on ? 'Linked' : 'Free'}</div><div class="s">${on ? 'All lamps share one colour' : 'Lamps are independent'}</div>`;
                    ]]]
