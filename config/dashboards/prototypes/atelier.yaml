          - type: custom:button-card
            template: atelier_chroma_header
            grid_options: { columns: full }

          # Master Living Room Harmonizer Bar
          - type: vertical-stack
            grid_options: { columns: full }
            card_mod:
              style: |
                #root {
                  gap: 8px !important;
                  padding: 12px 14px;
                  border-radius: 20px;
                  background: rgba(18, 20, 30, 0.75);
                  border: 1px solid rgba(255, 255, 255, 0.08);
                }
            cards:
              - type: custom:mushroom-light-card
                entity: light.living_room_lights
                name: Master Living Room
                icon: mdi:lightbulb-group-outline
                show_brightness_control: true
                show_color_temp_control: true
                show_color_control: true
                use_light_color: true
              
              # Master Kelvin Warm/Cold Spectrum Selector
              - type: custom:mushroom-chips-card
                alignment: justify
                chips:
                  - type: template
                    content: "2200K"
                    icon: mdi:candle
                    icon_color: amber
                    tap_action:
                      action: perform-action
                      perform_action: light.turn_on
                      target: { entity_id: light.living_room_lights }
                      data: { color_temp_kelvin: 2200 }
                  - type: template
                    content: "2700K"
                    icon: mdi:weather-sunset
                    icon_color: orange
                    tap_action:
                      action: perform-action
                      perform_action: light.turn_on
                      target: { entity_id: light.living_room_lights }
                      data: { color_temp_kelvin: 2700 }
                  - type: template
                    content: "4000K"
                    icon: mdi:white-balance-sunny
                    icon_color: yellow
                    tap_action:
                      action: perform-action
                      perform_action: light.turn_on
                      target: { entity_id: light.living_room_lights }
                      data: { color_temp_kelvin: 4000 }
                  - type: template
                    content: "6500K"
                    icon: mdi:weather-sunny
                    icon_color: blue
                    tap_action:
                      action: perform-action
                      perform_action: light.turn_on
                      target: { entity_id: light.living_room_lights }
                      data: { color_temp_kelvin: 6500 }

