                  - type: template
                    content: "2700K"
                    tap_action:
                      action: perform-action
                      perform_action: light.turn_on
                      target: { entity_id: light.light_2 }
                      data: { color_temp_kelvin: 2700 }
                  - type: template
                    content: "4000K"
                    tap_action:
                      action: perform-action
                      perform_action: light.turn_on
                      target: { entity_id: light.light_2 }
                      data: { color_temp_kelvin: 4000 }
                  - type: template
                    content: "6500K"
                    tap_action:
