                      perform_action: light.turn_on
                      target: { entity_id: light.light_2 }
                      data: { rgb_color: [0, 210, 255] }
                  - type: template
                    content: "Wheel"
                    icon: mdi:palette
                    tap_action:
                      action: more-info
                      entity: light.light_2

      # ── Spatial Node — Perimeter Govee Strip ─────────────────────
      - type: grid
        cards:
          - type: vertical-stack
            grid_options: { columns: full }
            card_mod:
              style: |
                #root {
                  gap: 8px !important;
                  padding: 12px 14px;
                  background: rgba(18, 22, 31, 0.75);
                  border: 1px solid rgba(255, 255, 255, 0.09);
