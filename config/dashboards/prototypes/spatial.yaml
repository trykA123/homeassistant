                    content: "Wheel"
                    icon: mdi:palette
                    tap_action:
                      action: more-info
                      entity: light.light_1

      # ── Spatial Node — Lamp Two ──────────────────────────────────
      - type: grid
        cards:
          - type: vertical-stack
