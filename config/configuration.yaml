# Home Assistant main configuration.
# Anything secret goes in secrets.yaml (git-ignored); reference it with !secret.

default_config:

# Mobile-first dashboard with custom cards and theme.

# Expose only the selected lights and TV to Apple Home and Siri.
homekit:
  - name: Home Assistant Lights
    filter:
      include_entities:
        - light.light_1
        - light.light_2
        - light.h619a
        - script.movie_time
    entity_config:
      light.h619a:
        name: Govee LED Strip
  - name: Philips TV
    port: 21064
    mode: accessory
    filter:
      include_entities:
        - media_player.tv

homeassistant:
  name: !secret home_name
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  elevation: !secret home_elevation
  unit_system: metric
  currency: RON
  country: RO
  time_zone: Europe/Bucharest
  # Published by TrueHL's Caddy; the internal URL is reachable from iPhones on LAN.
  external_url: https://home.erzago.duckdns.org
  internal_url: http://192.168.1.220:8123
  packages: !include_dir_named packages

# HTTP settings are NOT configured here. Home Assistant migrated the http:
# block into UI-managed storage (config/.storage/http); a YAML block is ignored
# and stops being accepted in 2027.2.0. Manage it in
# Settings > System > Network instead.
#
# Required for this deployment: trusted proxy 172.18.0.0/16 (the proxy-network
# subnet Caddy reaches us from). Without it every proxied request gets 400.

recorder:
  db_url: !secret recorder_db_url
  purge_keep_days: 30
  commit_interval: 5
  exclude:
    domains:
      - automation
      - update
    entity_globs:
      - sensor.*_uptime

logger:
  default: warning
  logs:
    homeassistant.components.mqtt: info

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js

automation: !include_dir_merge_list automations
script: !include scripts.yaml
scene: !include scenes.yaml
