- id: tv_dim
  alias: TV Dim
  description: Dim the living room when the TV turns on after dark, and restore it when the TV turns off.
  mode: restart
  triggers:
    - id: "on"
      trigger: state
      entity_id: media_player.tv
      to: "on"
      for: "00:00:05"
      not_from:
        - unavailable
        - unknown
    - id: "off"
      trigger: state
      entity_id: media_player.tv
      to: "off"
      for: "00:01:00"
      not_from:
        - unavailable
        - unknown
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: "on"
            - condition: state
              entity_id: sun.sun
              state: below_horizon
            - condition: template
              value_template: >-
                {% set t = state_attr('script.movie_time', 'last_triggered') %}
                {{ t is none or (now() - t).total_seconds() > 180 }}
            - condition: state
              entity_id: person.claud
              state: home
          sequence:
            - action: scene.create
              data:
                scene_id: before_tv
                snapshot_entities:
                  - light.light_1
                  - light.light_2
                  - light.h619a
            - action: light.turn_on
              target:
                entity_id:
                  - light.light_1
                  - light.light_2
              data:
                brightness_pct: 15
                color_temp_kelvin: 2500
                transition: 3
            - action: light.turn_on
              target:
                entity_id: light.h619a
              data:
                brightness_pct: 25
                rgb_color: [255, 115, 45]
                transition: 3
        - conditions:
            - condition: trigger
              id: "off"
            - condition: template
              value_template: "{{ states.scene.before_tv is not none }}"
            - condition: state
              entity_id: person.claud
              state: not_home
          sequence:
            - action: scene.delete
              target:
                entity_id: scene.before_tv
        - conditions:
            - condition: trigger
              id: "off"
            - condition: template
              value_template: "{{ states.scene.before_tv is not none }}"
          sequence:
            - action: scene.turn_on
              target:
                entity_id: scene.before_tv
              data:
                transition: 3
            - action: scene.delete
              target:
                entity_id: scene.before_tv
