- id: evening_at_sunset
  alias: Evening at Sunset
  description: Turn on evening scene when sunset approaches, owner is home, and lights are off.
  triggers:
    - trigger: sun
      event: sunset
      offset: "-00:15:00"
  conditions:
    - condition: state
      entity_id: person.claud
      state: home
    - condition: state
      entity_id: light.living_room_lights
      state: "off"
  actions:
    - action: scene.turn_on
      target:
        entity_id: scene.evening
